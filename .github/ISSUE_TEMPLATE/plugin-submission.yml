name: Plugin submission
description: Submit an unsigned plugin release for DBX Store review and repository signing.
title: "[Plugin Submission] "
body:
  - type: markdown
    attributes:
      value: |
        Use this Issue for pre-signing review. Keep plugin source in its own repository. After approval and DBX Store signing, open the final catalog PR against `t8y2/dbx-store:main`.

  - type: input
    id: plugin-id
    attributes:
      label: Plugin ID
      description: The exact `manifest.json` plugin ID.
      placeholder: com.example.plugin
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The semantic version submitted for review.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: publisher
    attributes:
      label: Publisher ID
      description: The publisher ID that will appear in the DBX Store catalog.
      placeholder: example
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source repository and tag
      description: Provide the public source repository URL and exact immutable tag or commit.
      placeholder: https://github.com/example/dbx-plugin/tree/v1.0.0
    validations:
      required: true

  - type: input
    id: candidates
    attributes:
      label: release-candidates.json URL
      description: HTTPS URL of the candidate metadata generated by the DBX plugin release workflow.
      placeholder: https://github.com/example/dbx-plugin/releases/download/v1.0.0/release-candidates.json
    validations:
      required: true

  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities and user workflow
      description: Explain what the plugin contributes and how users create connections or open its workbench.
    validations:
      required: true

  - type: textarea
    id: permissions
    attributes:
      label: Permissions, data access, and network access
      description: List every Manifest permission and explain files, credentials, hosts, APIs, or user data the plugin accesses.
    validations:
      required: true

  - type: textarea
    id: native
    attributes:
      label: Native sidecar behavior
      description: State whether the plugin contains native executables and describe subprocesses, listening ports, filesystem writes, and external commands. Write "None" for frontend-only plugins.
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: License
      placeholder: Apache-2.0
    validations:
      required: true

  - type: input
    id: support
    attributes:
      label: Homepage or support URL
      placeholder: https://github.com/example/dbx-plugin/issues
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission confirmation
      options:
        - label: The candidate packages are unsigned and match the disclosed source tag.
          required: true
        - label: I have not included private keys, tokens, credentials, or proprietary data.
          required: true
        - label: I understand that the final catalog PR targets `t8y2/dbx-store`, not `t8y2/dbx`.
          required: true
